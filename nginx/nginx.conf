events {
    worker_connections 1024;
}

http {
    # Resolver DNS interno de Docker con TTL bajo para re-resolver IPs
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location = /ocr {
            return 301 /ocr/;
        }

        location /ocr/ {
            set $ocr_api_backend http://ocr_api:8551;
            rewrite ^/ocr/(.*) /$1 break;
            proxy_pass $ocr_api_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 50M;
            proxy_read_timeout 120s;
        }

        location = /voice {
            return 301 /voice/;
        }

        location /voice/ {
            set $voice_api_backend http://voice_api:8553;
            rewrite ^/voice/(.*) /$1 break;
            proxy_pass $voice_api_backend;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 50M;
            proxy_read_timeout 120s;
        }

        # Prevenir caché en el punto de entrada raíz (index servido por Flet)
        location = / {
            set $flet_app http://app:8550;
            proxy_pass $flet_app;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }

        # Prevenir caché del index.html, service worker, manifiestos y versión
        location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
            set $flet_app http://app:8550;
            proxy_pass $flet_app;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }

        # Para assets estáticos pesados (imágenes, fuentes), mantener caché normal
        location /assets/ {
            set $flet_app http://app:8550;
            proxy_pass $flet_app;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            # Usar variable para forzar re-resolución DNS en cada request.
            # Si nginx usa upstream{} con nombre, cachea la IP indefinidamente.
            set $flet_app http://app:8550;
            proxy_pass $flet_app;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;

            proxy_buffering off;
        }
    }
}
