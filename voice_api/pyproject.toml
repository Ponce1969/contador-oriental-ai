[project]
name = "voice-api"
version = "1.0.0"
description = "FastAPI microservice for local voice-to-expense processing"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
